<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Perspective Prototype</title>
<style>
  :root {
    --bg: #111214; --panel: #1a1b1f; --line: #2c2e34; --text: #e8e8ea; --dim: #9a9ca3;
    --accent: #f2b24c; --ok: #6cc98a; --warn: #e0a13a; --bad: #e06a5a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 14px/1.4 system-ui, -apple-system, Segoe UI, sans-serif; }
  body { display: grid; grid-template-rows: auto 1fr; }
  header { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  header .sub { color: var(--dim); font-size: 13px; }
  header .spacer { flex: 1; }
  main { display: grid; grid-template-columns: 260px 1fr 300px; min-height: 0; }
  #strip { overflow-y: auto; border-right: 1px solid var(--line); padding: 10px; display: flex; flex-direction: column; gap: 10px; min-height: 0; }
  .card { flex: none; position: relative; border: 2px solid transparent; border-radius: 6px; overflow: hidden; cursor: pointer; background: #000; }
  .card.active { border-color: var(--accent); }
  .card canvas { display: block; width: 100%; height: 150px; }
  .card .label { position: absolute; left: 0; right: 0; bottom: 0; display: flex; justify-content: space-between;
    padding: 3px 6px; font-size: 11px; background: linear-gradient(transparent, rgba(0,0,0,.8)); }
  .badge { padding: 0 6px; border-radius: 8px; font-size: 10px; text-transform: uppercase; letter-spacing: .04em; }
  .badge.frame { background: var(--ok); color: #000; } .badge.lines { background: var(--warn); color: #000; }
  .badge.none { background: var(--bad); color: #000; } .badge.manual { background: #7aa7ff; color: #000; }
  #stage { position: relative; min-width: 0; min-height: 0; background: #0b0b0c; touch-action: none; }
  #stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  #hint { position: absolute; left: 50%; top: 10px; transform: translateX(-50%); background: rgba(0,0,0,.7);
    padding: 4px 10px; border-radius: 12px; font-size: 12px; color: var(--dim); pointer-events: none; }
  #panel { border-left: 1px solid var(--line); padding: 14px; overflow-y: auto; display: grid; gap: 14px; align-content: start; background: var(--panel); }
  .section h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--dim); margin: 0 0 8px; font-weight: 600; }
  .slider { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; margin-bottom: 10px; }
  .slider label { cursor: pointer; user-select: none; } .slider label:hover { color: var(--accent); }
  .slider output { font-variant-numeric: tabular-nums; color: var(--dim); }
  .slider input { grid-column: 1 / -1; width: 100%; accent-color: var(--accent); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  button { background: #2a2c32; color: var(--text); border: 1px solid #3a3d44; border-radius: 6px; padding: 6px 12px; font: inherit; cursor: pointer; }
  button:hover:not(:disabled) { background: #33363d; }
  button:disabled { opacity: .4; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #1a1205; font-weight: 600; }
  button.primary:hover:not(:disabled) { background: #f6c46e; }
  button.on { background: #3d3424; border-color: var(--accent); color: var(--accent); }
  .seg { display: inline-flex; border: 1px solid #3a3d44; border-radius: 6px; overflow: hidden; }
  .seg button { border: 0; border-radius: 0; }
  .toggles label { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; cursor: pointer; }
  .note { font-size: 12px; color: var(--dim); margin: 0 0 10px 24px; }
  #status { font-size: 12px; color: var(--dim); white-space: pre-line; min-height: 3em; }
  .keys { font-size: 12px; color: var(--dim); }
  kbd { background: #2a2c32; border: 1px solid #3a3d44; border-radius: 3px; padding: 0 4px; font-size: 11px; }
  #more { border-top: 1px solid var(--line); padding-top: 10px; }
  #more summary { cursor: pointer; color: var(--dim); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; font-weight: 600; user-select: none; }
  #more summary:hover { color: var(--text); }
  .more-body { display: grid; gap: 14px; margin-top: 12px; }
  @media (max-width: 900px) {
    body { height: auto; }
    main { grid-template-columns: 1fr; }
    #strip { flex-direction: row; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--line); }
    .card { width: 140px; }
    .card canvas { height: 95px; }
    #stage { height: 60vh; }
    #panel { border-left: 0; }
  }
</style>
</head>
<body>
<header>
  <h1>Perspective correction</h1>
  <span class="sub">Prototype · MoMA, NY June 24 2022</span>
  <span class="spacer"></span>
  <button id="autoAll" class="primary" title="Auto: Framed art on every photo">Auto all</button>
  <button id="resetAll">Reset all</button>
</header>
<main>
  <div id="strip"></div>
  <div id="stage">
    <canvas id="gl"></canvas>
    <canvas id="overlay"></canvas>
    <div id="hint" hidden></div>
  </div>
  <div id="panel">
    <div class="section">
      <div class="row">
        <button id="auto" class="primary" title="Find the picture frame and square it up (A)">Auto: Framed art</button>
        <button id="autoGeneral" title="Ignore frames; straighten from the photo's lines (G)">Auto: General</button>
      </div>
    </div>
    <div class="section">
      <h2>Crop</h2>
      <div class="seg" id="crop">
        <button data-crop="frame">To frame</button>
        <button data-crop="fill">Fill</button>
        <button data-crop="none">None</button>
      </div>
    </div>
    <details id="more">
      <summary>More</summary>
      <div class="more-body">
        <div class="section">
          <div class="row">
            <button id="guided">Adjust frame</button>
            <button id="reset">Reset</button>
            <button id="before" title="Hold to compare with the original">Before</button>
          </div>
        </div>
        <div class="section" id="sliders">
          <h2>Transform</h2>
        </div>
        <div class="section toggles" id="lens">
          <h2>Lens</h2>
          <label><input type="checkbox" id="lensProfile"> Profile correction</label>
          <div id="lensName" class="note"></div>
        </div>
        <div class="section toggles">
          <h2>View</h2>
          <label><input type="checkbox" id="grid"> Grid</label>
          <label><input type="checkbox" id="whole"> Show whole photo</label>
          <label><input type="checkbox" id="debug"> Show detected lines</label>
        </div>
        <div class="section">
          <h2>Auto result</h2>
          <div id="status">Not run yet.</div>
        </div>
        <div class="section keys">
          <kbd>B</kbd> hold for before · <kbd>←</kbd><kbd>→</kbd> photo · <kbd>A</kbd> auto framed · <kbd>G</kbd> auto general · <kbd>F</kbd> adjust frame · double-click a slider name to zero it
        </div>
      </div>
    </details>
  </div>
</main>
<script type="module" src="app.js"></script>
</body>
</html>
