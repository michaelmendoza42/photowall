feature_name: full-coverage-looping-mosaic
status: scoped-from-approved-spec
owner: Michael
source: specs/planning-context.yaml
core_value: Browse a full-window, spatially stable photo mosaic with seamless two-axis looping and recognizable adjoining album regions.
summary: >-
  Single-album and grouped multi-album views must fill the viewport at every
  supported pan position and zoom. The finite arrangement repeats exactly in
  both axes; exposed area beyond the base mosaic is filled with repeated photo
  content, not blank side bands, gutters, or corner holes. Optimize for friendly
  albums of 50 or more photos without adding an album-size admission rule.
  Grouped views retain recognizable album regions, but their irregular borders
  touch and may intermix. Signposts navigate toward stable region centers.
  A finite zoom-out limit provides a useful overview without excessive tiny
  copies. Exact zoom tuning is delegated, not fixed to a literal 2x or 4x factor.
in_scope:
  - id: PW-MOSAIC-01
    outcome: Single-album photo content covers the viewport throughout horizontal, vertical, and diagonal looping at supported zoom levels.
    future_story: e02s01
  - id: PW-MOSAIC-02
    outcome: The same loaded selection returns to the same photo arrangement after any full horizontal or vertical map period, with repeated copies opening the correct photo.
    future_stories: [e02s01, e02s02]
  - id: PW-MOSAIC-03
    outcome: Multiple albums occupy adjoining recognizable regions with irregular, potentially intermingled borders and no empty separators.
    future_story: e02s02
  - id: PW-MOSAIC-04
    outcome: Grouped signposts retain visibility rules and navigate toward the appropriate stable album center across wrap boundaries.
    future_story: e02s02
  - id: PW-MOSAIC-05
    outcome: Every zoom input stops at a finite useful overview while repeated photo content maintains full viewport coverage.
    future_story: e02s03
  - id: PW-MOSAIC-06
    outcome: Desktop/mobile browsing, dynamic loading, photo opening, and return-to-wall context remain reliable in both modes.
    future_stories: [e02s01, e02s02, e02s03]
out_of_scope:
  - item: Rigid rectangular album boxes, separated islands, or perfectly bounded album borders.
    reason: Conflicts with the approved adjoining organic-region experience.
  - item: Reshuffling while panning, zooming, or crossing a wrap boundary.
    reason: Would destroy spatial navigation and violates stable repetition.
  - item: Infinite zoom-out or an infinitely generated world.
    reason: The requested experience is a bounded overview of a repeating finite arrangement.
  - item: Removing album identity by distributing every album throughout the entire map.
    reason: Album regions and center-based navigation must remain useful.
  - item: Unrelated controls, photo-modal, filter, playlist, or mobile-fling redesign.
    reason: Preserve those flows; change only integration required by the new mosaic.
  - item: Special optimization for pathological or very small albums.
    reason: Friendly 50-plus-photo inputs are the agreed target, while existing smaller inputs must not crash.
  - item: Renderer replacement, backend/media/cache redesign, new dependencies, or library migration.
    reason: Not required by the approved behavior; any necessity discovered later requires separate approval.
  - item: Fixing the existing overlap-tap fixture failure or debug-overlay control interception independently.
    reason: These are recorded adjacent issues; repeated-photo activation within this mosaic still requires new explicit coverage.
constraints:
  - Preserve the configured library and trusted-LAN operating model.
  - Preserve stable photo identity and modest cropping; no stretching or wholesale loss of portrait/panorama character to fill space.
  - Full viewport coverage takes precedence over column-first styling.
  - For unchanged selection and loaded photo set, pan and zoom must not change arrangement or album centers.
  - Preserve incremental loading; a wrap traversal alone must not reshuffle the map or require loading the entire library first.
  - Existing signpost visibility/suppression, gestures, and photo-open behavior remain protected.
  - Use a finite overview limit; do not permit an effectively unbounded or ten-copy overview.
  - Exact minimum zoom and repetition-density tuning remain delegated implementation choices with visual validation.
  - Preserve all unrelated pending work; no wholesale staging, reset, formatting, or cleanup of the dirty tree.
success_criteria:
  - Single and grouped views have no layout-created viewport gaps at axis seams, corners, default zoom, minimum zoom, and supported viewport shapes.
  - Full-period travel reproduces identical photo identity and geometry for an unchanged loaded selection.
  - Grouped regions touch without blank gutters and retain recognizable album-centered areas rather than rigid boxes or a global random mixture.
  - Signposts target the corresponding album center through the nearest appropriate repeated map instance while retaining existing visibility rules.
  - Zoom inputs converge on the same finite lower bound; further zoom-out leaves scale unchanged and coverage complete.
  - Repeated-photo activation opens the correct record and closing restores the browsing context.
  - Paging and viewport changes preserve a usable browsing anchor and do not create persistent uncovered regions.
references:
  - specs/planning-context.yaml
  - docs/product/photo-wall-experience.md
  - specs/IMPACT_LATEST.md
  - specs/epics/e02-full-coverage-looping-mosaic/PLAN.md
