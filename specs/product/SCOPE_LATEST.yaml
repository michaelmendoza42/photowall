feature_name: large-album-performance
core_value: Photo Wall opens and stays responsive for large real libraries without compromising safe local media access or the wall-first browsing experience.
summary: >-
  This initiative improves the experience of opening, panning, and zooming large albums such as NY Edited.
  It addresses bounded derivative generation, cache correctness, client layout/culling cost, texture scheduling,
  and browser-observable desktop/mobile performance behavior. It preserves Pixi/WebGL as the renderer and keeps
  the configured photography root and trusted-LAN operating model unchanged.
in_scope:
  - id: PW-PERF-01
    outcome: Bound and coalesce cold derivative rendering while preserving atomic cache writes and cache-hit responsiveness.
    future_story: e01s01
  - id: PW-PERF-02
    outcome: Make media/cache identity correct across source changes and configured library-root changes.
    future_story: e01s02
  - id: PW-PERF-03
    outcome: Reduce client layout, culling, camera-update, and texture-loading work for sustained large-album browsing.
    future_story: e01s03
  - id: PW-PERF-04
    outcome: Protect large-album and mobile zoom behavior with reproducible unit and Playwright evidence.
    future_story: e01s04
out_of_scope:
  - item: Replacing Pixi/WebGL or introducing a second wall renderer.
    reason: The approved product contract requires one Pixi-first wall path.
  - item: Pre-rendering every full-detail derivative at startup.
    reason: It would delay readiness and impose unnecessary storage/CPU cost.
  - item: Deleting or migrating existing derivative cache namespaces.
    reason: Destructive cache cleanup requires a separate explicit approval gate.
  - item: Weakening source-root realpath/stat safety checks.
    reason: Performance work must not relax filesystem-boundary protections.
  - item: Changing filters, playlists, visual composition, authentication, or the configured photo-library root.
    reason: These do not directly solve the large-album performance goal.
constraints:
  - Preserve the configured /mnt/sigma photography root and trusted-LAN model.
  - Keep cache hits independent from cold-render queue delays.
  - Do not add dependencies or persistent background infrastructure without an explicit approval gate.
  - Keep the existing working tree intact; changes must be narrow and avoid overwriting unrelated work.
success_criteria:
  - Initial large-album viewport uses bounded work and becomes visibly populated without black sprites.
  - Cold duplicate derivative requests render once; distinct cold renders have a bounded concurrency limit.
  - Source/root changes cannot serve stale immutable browser/cache media.
  - Sustained pan/zoom has bounded layout and texture work, with no unhandled load failures.
  - Desktop and mobile zoom behavior have passing Playwright coverage.
