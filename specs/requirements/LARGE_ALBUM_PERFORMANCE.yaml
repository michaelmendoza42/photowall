id: large-album-performance
status: active
completion_target:
  - id: R1
    requirement: Cold duplicate derivative requests coalesce and distinct renders remain bounded; cache hits bypass the queue.
  - id: R2
    requirement: Browser and server cache identity includes source version and configured library root without deleting legacy caches.
  - id: R3
    requirement: Unchanged photo layouts are not repacked on camera movement; visible-row selection and camera publication stay bounded.
  - id: R4
    requirement: Texture loading is prioritized, bounded, failure-safe, and has a finite retention policy.
  - id: R5
    requirement: Large-album desktop and mobile scenarios have repeatable automated evidence, including pinch and button zoom.
  - id: R6
    requirement: Real-library validation shows a populated initial overview, responsive pan/zoom, no black sprites, and no new console/network failures beyond documented environment noise.
non_goals:
  - destructive cache cleanup or migration
  - source-root safety relaxation
  - renderer replacement or external media infrastructure
completion_rule: All R1-R6 have passing automated evidence, current canonical docs agree with implementation, and real-library browser validation is ready for review.
